networks:
  displayrr:
    driver: bridge

services:
  switchrr:
    build: ./switchrr
    restart: unless-stopped
    networks:
      - displayrr
    ports:
      - "5556:5556"   # OLED Indicatrr hardware events
      - "5558:5558"   # HUB75 hub75pi hardware events
    env_file: .env

  boardrr:
    build: ./boardrr
    restart: unless-stopped
    networks:
      - displayrr
    ports:
      - "5600:5600"
    env_file: .env
    environment:
      OUTPUT_MODE: zmq
      MODE_NAME: uk_tdd
      SWITCHRR_FRAME_BIND_ADDRESS: tcp://0.0.0.0:5600
      SWITCHRR_EVENT_ADDRESS: tcp://switchrr:5557
      TZ: Europe/London
    volumes:
      - ./boardrr/config.json:/app/config.json:ro
      - ./boardrr/state.json:/app/state.json

  powrr:
    build: ./powrr
    restart: unless-stopped
    networks:
      - displayrr
    env_file: .env
    environment:
      MODE_NAME: powrr
      SWITCHRR_FRAME_BIND_ADDRESS: tcp://0.0.0.0:5601
      SWITCHRR_EVENT_ADDRESS: tcp://switchrr:5557

  issrr:
    build: ./issrr
    restart: unless-stopped
    networks:
      - displayrr
    env_file: .env
    environment:
      MODE_NAME: issrr
      SWITCHRR_FRAME_BIND_ADDRESS: tcp://0.0.0.0:5602
      SWITCHRR_EVENT_ADDRESS: tcp://switchrr:5557

  tiderr:
    build: ./tiderr
    restart: unless-stopped
    networks:
      - displayrr
    env_file: .env
    environment:
      MODE_NAME: tiderr
      SWITCHRR_FRAME_BIND_ADDRESS: tcp://0.0.0.0:5603
      SWITCHRR_EVENT_ADDRESS: tcp://switchrr:5557

  claudrr:
    build: ./claudrr
    restart: unless-stopped
    networks:
      - displayrr
    env_file: .env
    environment:
      MODE_NAME: claudrr
      SWITCHRR_FRAME_BIND_ADDRESS: "tcp://0.0.0.0:5604"
      SWITCHRR_EVENT_ADDRESS: "tcp://switchrr:5557"

  relayrr:
    build: ./relayrr
    restart: unless-stopped
    networks:
      - displayrr
    environment:
      SOURCE_ADDR: tcp://boardrr:5600
      PORT: "5700"
    ports:
      - "5700:5700"

  firmwarerr:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./hub75rr:/usr/share/nginx/html:ro
    ports:
      - "8889:80"

  webrr:
    build: ./webrr
    restart: unless-stopped
    networks:
      - displayrr
    env_file: .env
    environment:
      FRAME_TAP_ADDRESS: tcp://switchrr:5650
      SWITCHRR_EVENT_ADDRESS: tcp://switchrr:5557
      SWITCHRR_HW_EVENT_ADDRESS: tcp://switchrr:5556
    ports:
      - "8888:8888"
